<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/style-login.css">
    <script src="js/script-login.js" defer></script>
    <title>Daftar - MAccessoris</title>
</head>
<body>

    <div class="form-wrapper">
        <h2 class="form-title">Daftar Akun</h2>
        <p class="form-detail">Buat akun untuk menyimpan alamat, memantau pesanan, dan mengelola barang favorit.</p>
        <form id="registerForm" action="#">
            <div class="form-group">
                <label for="regName" class="required">Nama Akun</label>
                <input type="text" id="regName" name="name" placeholder="Nama lengkap kamu" autocomplete="name" required>
            </div>
            <div class="form-group">
                <label for="regEmail" class="required">Alamat Email</label>
                <input type="email" id="regEmail" name="email" placeholder="example@example.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="regPassword" class="required">Kata Sandi</label>
                <input type="password" id="regPassword" name="password" placeholder="Minimal 6 karakter" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <label for="regConfirm" class="required">Konfirmasi Kata Sandi</label>
                <input type="password" id="regConfirm" name="confirm" placeholder="Ulangi kata sandi" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-blue mb-4">Buat Akun</button>
            <p>Sudah memiliki akun? <a href="login.html" class="form-link">Masuk</a></p>
        </form>
    </div>

    <script src="js/store.js"></script>
</body>
</html>
