<!DOCTYPE html>
<html lang="id">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/all.css">
	<link rel="stylesheet" href="css/style-login.css">
	<script src="js/script-login.js" defer></script>
	<title>Masuk - MAccessoris</title>
</head>

<body>

	<div class="form-wrapper">
		<h2 class="form-title">Masuk</h2>
		<p class="form-detail">Masuk terlebih dahulu untuk mengakses akun, riwayat transaksi, dan favorit kamu.</p>
		<form id="loginForm" action="#">
			<div class="form-group">
				<label for="email" class="required">Alamat Email</label>
				<input type="email" id="email" name="email" placeholder="example@example.com" autocomplete="email"
					required>
			</div>
			<div class="form-group">
				<label for="password" class="required">Kata Sandi</label>
				<input type="password" id="password" name="password" placeholder="Kata sandi kamu"
					autocomplete="current-password" required>
			</div>
			<div class="mb-4">
				<a href="#" class="form-link" id="forgotPassword">Lupa Kata Sandi</a>
			</div>
			<button type="submit" class="btn btn-blue mb-4" id="loginButton">Masuk</button>

			<p>Belum memiliki akun? <a href="register.html" class="form-link">Daftar Akun</a></p>
			<p>Masuk sebagai Admin? <a href="startbootstrap-sb-admin-2-gh-pages/admin-index.html"
					class="form-link">Admin</a></p>
		</form>
	</div>

	<script src="js/store.js"></script>
	<script>
		document.getElementById('forgotPassword').addEventListener('click', function (event) {
			event.preventDefault();
			var email = document.getElementById('email').value.trim();
			if (window.MAccessoris) {
				window.MAccessoris.showToast(
					email
						? 'Silakan hubungi admin melalui WhatsApp untuk mengatur ulang kata sandi akun ' + email + '.'
						: 'Masukkan alamat email kamu terlebih dahulu.',
					'info'
				);
			}
		});
	</script>
</body>

</html>
